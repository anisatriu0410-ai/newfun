<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lentera Fun Learning</title>
<style>
:root{--bg:#F6F3FA;--sf:#fff;--ink:#2a2140;--mut:#6d6585;--pri:#7352A5;--night:#4b3475;--acc:#F0932B;--ok:#3f8f4a;--bad:#c9442f;--ln:#e4dcef;--soft:#f1ecf7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#16111f;--sf:#221a31;--ink:#f0eaf8;--mut:#b3a9c8;--pri:#8460bf;--night:#0f0b17;--ln:#382c4f;--soft:#2c2240;--ok:#6cc27a;--bad:#ff8672}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#16111f;--sf:#221a31;--ink:#f0eaf8;--mut:#b3a9c8;--pri:#8460bf;--night:#0f0b17;--ln:#382c4f;--soft:#2c2240;--ok:#6cc27a;--bad:#ff8672}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Trebuchet MS','Segoe UI',system-ui,sans-serif}
h1,h2,h3{margin:0;line-height:1.2}
.top{background:var(--sf);border-bottom:1px solid var(--ln);display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 16px;flex-wrap:wrap}
.lg{height:46px;background:#fff;border-radius:10px;padding:2px;display:block}.who{font-size:14px;display:flex;align-items:center;gap:8px}.who small{background:var(--acc);color:#2a2140;border-radius:99px;padding:1px 9px;font-weight:700}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--pri)}
nav button{flex:none;border:0;background:none;color:#fff;font:700 14px inherit;padding:8px 14px;border-radius:99px;cursor:pointer;opacity:.85}nav button.on{background:#fff;color:#4b3475;opacity:1}
main{max-width:1080px;margin:0 auto;padding:16px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.ctl input,.ctl select{width:auto;margin:0}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.stat{background:var(--sf);border:1px solid var(--ln);border-left:5px solid var(--acc);border-radius:10px;padding:12px 14px}.stat b{display:block;font-size:24px}.stat span{color:var(--mut);font-size:13px}
.b{border:0;background:var(--pri);color:#fff;font:700 14px inherit;padding:9px 16px;border-radius:10px;cursor:pointer}.b.s2{padding:5px 10px;font-size:13px}.b.gh{background:transparent;color:var(--pri);border:1px solid currentColor}.b.dg{background:var(--bad);color:#fff}.b.am{background:var(--acc);color:#2a2140}.b.ok{background:var(--ok);color:#fff}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.tw{overflow-x:auto;background:var(--sf);border:1px solid var(--ln);border-radius:12px;margin-bottom:14px}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--ln);vertical-align:top}th{background:var(--soft);white-space:nowrap}.nw{white-space:nowrap}small{color:var(--mut)}
.tg{display:inline-block;background:var(--soft);border:1px solid var(--ln);border-radius:99px;padding:0 8px;margin:1px 3px 1px 0;font-size:12px}.tg.L{background:var(--ok);color:#fff;border:0}.tg.M{background:var(--acc);color:#2a2140;border:0}.tg.B{background:var(--bad);color:#fff;border:0}
label{display:block;font-weight:700;font-size:14px;margin-bottom:10px}input,select,textarea{display:block;width:100%;margin-top:4px;font:inherit;padding:9px 10px;border:1px solid var(--ln);border-radius:9px;background:var(--bg);color:var(--ink)}textarea{min-height:76px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));column-gap:12px}fieldset{border:1px solid var(--ln);border-radius:10px;margin:0 0 12px}.ck{display:block;font-weight:600;margin:3px 0}.ck input{display:inline;width:auto;margin-right:6px}
.ac{display:flex;gap:8px;justify-content:flex-end}.note{font-size:13px;color:var(--mut);background:var(--soft);border-radius:10px;padding:8px 12px;margin:0 0 12px}
dialog{border:0;border-radius:16px;padding:18px;width:min(580px,94vw);background:var(--sf);color:var(--ink);max-height:92vh}dialog::backdrop{background:#0008}
.chips{display:flex;gap:5px;flex-wrap:wrap}.chips button{border:1px solid var(--ln);background:var(--soft);color:var(--ink);border-radius:99px;padding:4px 11px;font:700 13px inherit;cursor:pointer}
.chips button.on.H{background:var(--ok);color:#fff}.chips button.on.I{background:#3b82c4;color:#fff}.chips button.on.S{background:var(--acc);color:#2a2140}.chips button.on.A{background:var(--bad);color:#fff}
.rep{border-left:5px solid var(--acc)}.rep p{margin:5px 0}.ph{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.ph img{height:110px;border-radius:8px;border:1px solid var(--ln);cursor:pointer}
.bar{height:10px;background:var(--soft);border-radius:9px;overflow:hidden;display:flex;min-width:90px}.bar i{display:block;height:100%}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--night);color:#fff;padding:10px 18px;border-radius:12px;font-weight:700;z-index:99;max-width:92vw;display:none}
.login{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}.hero{background:#fff;color:#2a2140;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:30px;gap:6px;text-align:center}.hero img{width:min(340px,80%)}
.lf{display:flex;flex-direction:column;justify-content:center;padding:32px;max-width:420px;width:100%;margin:0 auto}
@media(max-width:760px){.login{grid-template-columns:1fr}}
nav.gn{gap:4px;padding:8px 10px}nav.gn button{display:flex;flex-direction:column;align-items:center;gap:0;font-size:12px;padding:6px 12px;border-radius:14px;min-width:78px}nav.gn button span{font-size:22px;line-height:1.2}
nav.sn{background:var(--soft);border-bottom:1px solid var(--ln);padding:6px 10px}nav.sn button{color:var(--ink);opacity:1;background:var(--sf);border:1px solid var(--ln);padding:6px 12px;font-size:13px}nav.sn button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.who select{width:auto;margin:0;padding:3px 8px}
</style>
